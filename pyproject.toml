[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-trail-backend"
version = "0.1.0"
description = "Bounded next-token traces for Token Trail"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.7",
  "torch==2.8.0",
  "transformers==4.55.4",
  "huggingface-hub==0.34.4",
  "safetensors==0.6.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
